<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Central Radio Taxi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light p-4">

<div class="container">
    <h2 class="mb-4 text-primary"><i class="fas fa-headset"></i> Central de Radio Taxi</h2>

    <!-- Estado de Flota -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="fas fa-taxi"></i> Flota y Cola de Conductores</h5>
            <span id="contadorLibres" class="badge bg-success">0 Móviles Libres</span>
        </div>
        <div class="card-body">
            <div id="gridConductores" class="row">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
    </div>

    <!-- Solicitudes Web de Clientes -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h5 class="mb-0"><i class="fas fa-globe"></i> Solicitudes Web de Clientes (En Espera)</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Cliente</th>
                            <th>Teléfono</th>
                            <th>Origen</th>
                            <th>Destino</th>
                            <th>Estado</th>
                            <th>Asignar Móvil (Operadora)</th>
                        </tr>
                    </thead>
                    <tbody id="tablaPedidos">
                        <tr><td colspan="7" class="text-center">Cargando solicitudes...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // CAMBIA ESTE LINK POR TU URL DE GOOGLE APPS SCRIPT
    const WEB_APP_URL = "AQUÍ_PEGA_TU_URL_DE_APPS_SCRIPT";

    async function cargarDatosCentral() {
        try {
            let res = await fetch(WEB_APP_URL + "?t=" + new Date().getTime());
            let data = await res.json();
            
            renderizarConductores(data.conductores || []);
            renderizarPedidos(data.pedidos || [], data.conductores || []);
        } catch (e) {
            console.error("Error al cargar datos de la central:", e);
        }
    }

    function renderizarConductores(conductores) {
        let grid = document.getElementById("gridConductores");
        let libresCount = 0;
        grid.innerHTML = "";

        conductores.forEach(c => {
            if (c.estado === "LIBRE") libresCount++;
            let badgeClass = c.estado === "LIBRE" ? "bg-success" : "bg-secondary";

            grid.innerHTML += `
                <div class="col-md-4 mb-3">
                    <div class="border rounded p-3 bg-white shadow-sm">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="fw-bold mb-1">${c.nombre}</h6>
                            <span class="badge ${badgeClass}">${c.estado}</span>
                        </div>
                        <p class="text-muted small mb-0"><i class="fas fa-phone"></i> ${c.telefono}</p>
                    </div>
                </div>
            `;
        });

        document.getElementById("contadorLibres").innerText = `${libresCount} Móviles Libres`;
    }

    function renderizarPedidos(pedidos, conductores) {
        let tbody = document.getElementById("tablaPedidos");
        tbody.innerHTML = "";

        // Filtramos solo los pedidos que están pendientes ("Por Asignar" o vacíos)
        let pendientes = pedidos.filter(p => !p.movilElegido || p.movilElegido === "Por Asignar");

        if (pendientes.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">No hay solicitudes web pendientes.</td></tr>`;
            return;
        }

        // Filtramos de la flota solo los que están LIBRES para que la operadora los elija
        let choferesLibres = conductores.filter(c => c.estado === "LIBRE");

        pendientes.forEach((p, index) => {
            let opcionesHtml = "";
            if (choferesLibres.length > 0) {
                let opciones = choferesLibres.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join("");
                opcionesHtml = `
                    <select id="sel-${index}" class="form-select form-select-sm d-inline-block w-auto me-2">
                        ${opciones}
                    </select>
                    <button class="btn btn-success btn-sm" onclick="asignarChoferManual(${p.fila}, 'sel-${index}')">
                        <i class="fas fa-check"></i> Asignar
                    </button>
                `;
            } else {
                opcionesHtml = `<span class="badge bg-warning text-dark">Sin móviles libres</span>`;
            }

            tbody.innerHTML += `
                <tr>
                    <td>${p.hora}</td>
                    <td class="fw-bold">${p.cliente}</td>
                    <td><a href="https://wa.me/56${p.telefono}" target="_blank"><i class="fab fa-whatsapp text-success"></i> ${p.telefono}</a></td>
                    <td>${p.origen}</td>
                    <td>${p.destino}</td>
                    <td><span class="badge bg-warning text-dark">Pendiente</span></td>
                    <td>${opcionesHtml}</td>
                </tr>
            `;
        });
    }

    async function asignarChoferManual(filaPedido, selectId) {
        const selectElement = document.getElementById(selectId);
        if (!selectElement) return;

        const movilElegido = selectElement.value;

        if (!confirm(`¿Confirmas asignar a "${movilElegido}" para esta carrera?`)) return;

        try {
            let url = `${WEB_APP_URL}?action=asignarManual&row=${filaPedido}&movil=${encodeURIComponent(movilElegido)}`;
            await fetch(url);
            
            alert(`¡Móvil "${movilElegido}" asignado con éxito!`);
            cargarDatosCentral();
        } catch (e) {
            console.error("Error al asignar:", e);
            alert("Error al conectar con la planilla.");
        }
    }

    // Cargar al iniciar y actualizar cada 6 segundos
    cargarDatosCentral();
    setInterval(cargarDatosCentral, 6000);
</script>

</body>
</html>
