<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Central - Radiotaxis</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
        h2 { color: #333; text-align: center; }
        .container { max-width: 950px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; font-size: 14px; }
        th { background: #007bff; color: white; }
        .btn-asignar { background: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
        .btn-asignar:hover { background: #218838; }
        select { padding: 5px; border-radius: 4px; border: 1px solid #ccc; }
        .refresh-btn { background: #17a2b8; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚖 Panel de Control - Central de Taxis</h2>
    <button class="refresh-btn" onclick="cargarDatos()">🔄 Actualizar Panel</button>
    
    <table>
        <thead>
            <tr>
                <th>Hora</th>
                <th>Cliente</th>
                <th>Teléfono</th>
                <th>Origen ➔ Destino</th>
                <th>Estado</th>
                <th>Asignar Conductor</th>
            </tr>
        </thead>
        <tbody id="tabla-pedidos">
            <tr><td colspan="6" style="text-align:center;">Cargando datos...</td></tr>
        </tbody>
    </table>
</div>

<script>
    // PEGA AQUÍ LA URL DE TU WEB APP DE GOOGLE APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzjJA4UIRAarfrtTVo2WBpoHTlrKYtl2rLjWVzwszJBbud-UCwPt7eVx9NPrnV5xOeT/exec";
    let listaConductores = [];

    async function cargarDatos() {
        const tbody = document.getElementById("tabla-pedidos");
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Actualizando...</td></tr>`;
        
        try {
            let response = await fetch(WEB_APP_URL);
            let resJson = await response.json();
            
            listaConductores = resJson.conductores || [];
            let pedidos = resJson.pedidos || [];
            
            tbody.innerHTML = "";
            
            if (pedidos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No hay pedidos registrados.</td></tr>`;
                return;
            }

            pedidos.forEach(row => {
                let opcionesSelect = listaConductores.map(c => `<option value="${c.nombre}">${c.nombre}</option>`).join("");

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${row.fechaHora.split(" ")[1] || row.fechaHora}</td>
                    <td><b>${row.cliente}</b></td>
                    <td><a href="https://wa.me/56${row.telefono}" target="_blank">${row.telefono}</a></td>
                    <td>${row.origen} ➔ ${row.destino}</td>
                    <td><span style="color: ${row.estado === 'Pendiente' ? 'orange' : 'green'}">${row.estado}</span></td>
                    <td>
                        ${row.estado === 'Pendiente' ? `
                            <select id="conductor-${row.fila}">
                                ${opcionesSelect}
                            </select>
                            <button class="btn-asignar" onclick="asignar(${row.fila})">Asignar</button>
                        ` : `<b>${row.movilElegido}</b>`}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:red;">Error al conectar con el servidor.</td></tr>`;
        }
    }

    async function asignar(fila) {
        let select = document.getElementById(`conductor-${fila}`);
        let movilElegido = select.value;

        let datos = {
            action: "asignar",
            fila: fila,
            movilElegido: movilElegido
        };

        try {
            let response = await fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(datos)
            });
            let result = await response.json();
            if (result.result === "success") {
                alert(`¡${movilElegido} asignado correctamente al viaje!`);
                cargarDatos();
            } else {
                alert("Hubo un error al asignar.");
            }
        } catch (error) {
            alert("Error de red.");
        }
    }

    // Cargar al abrir la página y refrescar cada 15 segundos
    cargarDatos();
    setInterval(cargarDatos, 15000);
</script>

</body>
</html>
