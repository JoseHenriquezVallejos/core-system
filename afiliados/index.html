<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llave en Mano</title>
    <!-- Manifest dinámico con ruta relativa corregida -->
    <link id="dynamic-manifest" rel="manifest" href="./manifest.json">
    <!-- Icono dinámico para la cabecera / favicon con ruta relativa -->
    <link id="dynamic-favicon" rel="icon" href="./icono.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        body { margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f1f5f9; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 700px; background: white; padding-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); min-height: 100vh; position: relative; box-sizing: border-box; }
        .header { background: #0f172a; color: #ffffff; padding: 25px 20px; text-align: center; border-bottom: 4px solid #d4af37; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 300; letter-spacing: 1px; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: #d4af37; letter-spacing: 2px; }
        
        #contenido-principal { display: none; }

        .swiper { width: 100%; height: auto !important; background: #ffffff; padding: 10px 10px 15px 10px; box-sizing: border-box; }
        .swiper-slide { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 280px; }
        .swiper-slide img { width: 100%; max-height: 220px; object-fit: contain; display: block; }
        
        .slide-desc { 
            font-size: 14px; 
            color: #d4af37; 
            margin-top: 10px; 
            font-weight: 600; 
            text-align: center; 
            padding: 0 15px;
            line-height: 1.3; 
            min-height: 2.8em; 
        }

        /* BOTONES PRINCIPALES ARRIBA DEL TODO */
        .button-grid { display: flex; flex-direction: column; gap: 8px; padding: 10px 15px; }
        .btn-action { background: #334155; color: white; padding: 12px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; width: 100%; box-sizing: border-box; }
        .btn-green { background: #0fb396; }
        .btn-hotmart { background: #eb5757; }
        .btn-negro { background: #000000; color: #ffffff; display: none; } /* Oculto por defecto hasta validar datos */
        
        /* ACORDEONES ACHICADOS Y MÁS COMPACTOS ABAJO */
        .faq-section { padding: 10px 15px; margin-top: 5px; }
        .accordion { background: #0f172a; color: white; cursor: pointer; padding: 10px 12px; width: 100%; border: none; text-align: left; border-radius: 6px; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        .panel { padding: 0 12px; background-color: #f8fafc; max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out; border-left: 3px solid #d4af37; margin-bottom: 5px; text-align: justify; font-size: 13px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1 id="nombre-visual">Cargando...</h1>
        <p id="subtitulo-visual">Obteniendo información...</p>
    </div>
    
    <div id="contenido-principal">
        <div class="swiper main-swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide" id="slide-1"><img id="f1" src=""><p id="desc1" class="slide-desc"></p></div>
                <div class="swiper-slide" id="slide-2"><img id="f2" src=""><p id="desc2" class="slide-desc"></p></div>
                <div class="swiper-slide" id="slide-3"><img id="f3" src=""><p id="desc3" class="slide-desc"></p></div>
                <div class="swiper-slide" id="slide-4"><img id="f4" src=""><p id="desc4" class="slide-desc"></p></div>
                <div class="swiper-slide" id="slide-5"><img id="f5" src=""><p id="desc5" class="slide-desc"></p></div>
            </div>
            <div class="swiper-pagination"></div>
        </div>

        <!-- Botones de Acción Inmediata (Arriba de los acordeones) -->
        <div class="button-grid">
            <a id="btn-wa" href="#" class="btn-action btn-green">💬 7 Días Gratis / Conversar</a>
            <a id="btn-hotmart" href="#" class="btn-action btn-hotmart">💳 Pagar Suscripción</a>
            <a id="btn-docum" href="#" target="_blank" class="btn-action btn-negro">📁 Documentación</a>
        </div>

        <!-- Acordeones Compactos Originales -->
        <div class="faq-section">
            <button class="accordion">...</button><div class="panel"><p></p></div>
            <button class="accordion">...</button><div class="panel"><p></p></div>
            <button class="accordion">...</button><div class="panel"><p></p></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5JVh7CU6HrRSvH1hzI_LSD61AMNNQokYez2snOaS0WgNNCLZszqaDDsRhe7yLpEtwL3PAffa4AN9T/pub?gid=0&single=true&output=csv';

    async function init() {
        const params = new URLSearchParams(window.location.search);
        const idBusqueda = params.get('id');
        
        if (!idBusqueda) {
            document.getElementById('nombre-visual').innerText = "ENLACE INCOMPLETO";
            document.getElementById('subtitulo-visual').innerText = "FALTA EL ID EN LA URL";
            return;
        }

        const idLimpioBusqueda = idBusqueda.trim().toLowerCase();

        try {
            const res = await fetch(SHEET_URL);
            const data = await res.text();
            
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;

            for (let i = 0; i < data.length; i++) {
                let char = data[i];
                let nextChar = data[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentCell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentCell.trim());
                    currentCell = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') { i++; }
                    currentRow.push(currentCell.trim());
                    rows.push(currentRow);
                    currentRow = [];
                    currentCell = '';
                } else {
                    currentCell += char;
                }
            }
            if (currentCell !== '' || currentRow.length > 0) {
                currentRow.push(currentCell.trim());
                rows.push(currentRow);
            }

            const user = rows.find(r => r[0] && r[0].replace(/['"]+/g, '').trim().toLowerCase() === idLimpioBusqueda);
            
            if (user) {
                let nombreAfiliado = user[1] ? user[1].replace(/['"]+/g, '').trim() : "Llave en Mano";
                let subtituloAfiliado = user[2] ? user[2].replace(/['"]+/g, '').trim() : "Afiliados";

                document.getElementById('nombre-visual').innerText = nombreAfiliado;
                document.getElementById('subtitulo-visual').innerText = subtituloAfiliado;
                document.title = nombreAfiliado + " - Llave en Mano";

                let iconoUrl = (user[27] && user[27].trim() !== "") ? user[27].replace(/['"]+/g, '').trim() : "./icono.jpg";

                let faviconTag = document.getElementById('dynamic-favicon');
                if (faviconTag) faviconTag.href = iconoUrl;

                const manifestData = {
                    "name": nombreAfiliado,
                    "short_name": nombreAfiliado,
                    "start_url": window.location.href,
                    "display": "standalone",
                    "background_color": "#0f172a",
                    "theme_color": "#0f172a",
                    "icons": [
                        { "src": iconoUrl, "sizes": "192x192", "type": "image/jpeg" },
                        { "src": iconoUrl, "sizes": "512x512", "type": "image/jpeg" }
                    ]
                };

                const stringManifest = JSON.stringify(manifestData);
                const blob = new Blob([stringManifest], {type: 'application/json'});
                const manifestURL = URL.createObjectURL(blob);
                document.getElementById('dynamic-manifest').setAttribute('href', manifestURL);

                // Asignar WhatsApp con el texto enfocado en los 7 días gratis y conversar
                if(user[3] && user[3].trim() !== "") {
                    let urlBot = user[3].replace(/['"]+/g, '').trim();
                    let textoMensaje = `Hola, vengo del enlace de ${nombreAfiliado}, quiero mis 7 días gratis o conversar sobre la app.`;
                    
                    if (urlBot.includes('wa.me/')) {
                        document.getElementById('btn-wa').href = `https://wa.me/56945491173?text=${encodeURIComponent(textoMensaje)}`;
                    } else {
                        let separador = urlBot.includes('?') ? '&' : '?';
                        document.getElementById('btn-wa').href = urlBot + separador + 'text=' + encodeURIComponent(textoMensaje);
                    }
                }

                if(user[4] && user[4].trim() !== "") {
                    document.getElementById('btn-hotmart').href = user[4].replace(/['"]+/g, '').trim();
                }

                // Configuración dinámica del botón negro adicional (Columnas AC: titulo_docum, AD: link_docum)
                let tituloDoc = user[28] ? user[28].replace(/['"]+/g, '').trim() : ""; // Columna AC (índice 28)
                let linkDoc = user[29] ? user[29].replace(/['"]+/g, '').trim() : "";   // Columna AD (índice 29)
                
                if (tituloDoc !== "" && linkDoc !== "") {
                    let btnDocum = document.getElementById('btn-docum');
                    btnDocum.innerText = tituloDoc;
                    btnDocum.href = linkDoc;
                    btnDocum.style.display = 'flex'; // Muestra el botón si hay datos
                }
                
                for(let i=0; i<5; i++) {
                    let fotoCol = 5 + (i * 2);
                    let descCol = 6 + (i * 2);
                    
                    let imgUrl = user[fotoCol] ? user[fotoCol].replace(/['"]+/g, '').trim() : "";
                    let descText = user[descCol] ? user[descCol].replace(/['"]+/g, '').trim() : "";

                    let slideElement = document.getElementById('slide-'+(i+1));

                    if (slideElement) {
                        slideElement.style.display = 'flex';
                        if(document.getElementById('f'+(i+1))) document.getElementById('f'+(i+1)).src = imgUrl;
                        if(document.getElementById('desc'+(i+1))) document.getElementById('desc'+(i+1)).innerText = descText;
                    }
                }

                document.querySelectorAll('.accordion').forEach((acc, index) => {
                    let tCol = 21 + (index * 2); 
                    let cCol = 22 + (index * 2);
                    if (user[tCol]) acc.innerHTML = user[tCol].replace(/['"]+/g, '').trim();
                    let panel = acc.nextElementSibling;
                    if (panel && user[cCol]) panel.querySelector('p').innerText = user[cCol].replace(/['"]+/g, '').trim();
                });

                document.getElementById('contenido-principal').style.display = 'block';
                new Swiper('.main-swiper', { loop: true, autoplay: { delay: 3500 }, pagination: { el: '.swiper-pagination' } });

            } else {
                document.getElementById('nombre-visual').innerText = "ID NO ENCONTRADO";
                document.getElementById('subtitulo-visual').innerText = "VERIFICA TU ENLACE";
            }
        } catch (e) {
            console.error("Error al cargar configuración:", e);
            document.getElementById('nombre-visual').innerText = "ERROR DE CONEXIÓN";
            document.getElementById('subtitulo-visual').innerText = "INTENTA NUEVAMENTE";
        }
    }
    init();

    // Lógica original de apertura/cierre de acordeones
    document.querySelectorAll('.accordion').forEach(acc => {
        acc.addEventListener('click', function() {
            this.classList.toggle("active");
            var panel = this.nextElementSibling;
            panel.style.maxHeight = panel.style.maxHeight ? null : panel.scrollHeight + "px";
        });
    });
</script>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error', err));
        });
    }
</script>
</body>
</html>
