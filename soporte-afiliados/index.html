<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Chat Funnel</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f4f4; }
    #chat { max-width: 400px; margin: 20px auto; background:#fff; padding:15px; border-radius:8px; }
    .msg { margin:8px 0; padding:10px; border-radius:6px; }
    .bot { background:#e0e0e0; text-align:left; }
    .user { background:#d1ffd1; text-align:right; }
    .btns { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .chat-btn { flex:1; padding:8px; background:#007bff; color:#fff; border:none; border-radius:6px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="chat">
    <div class="msg bot"><strong id="nombreAfiliado">NOMBRE_AFILIADO</strong> te da la bienvenida 👋</div>
    <div class="btns" id="botones"></div>
    <div class="msg bot"><a id="waLink" href="NUMERO_WHATSAPP" target="_blank">📲 Contacto directo por WhatsApp</a></div>
  </div>

  <script>
    // Datos simulados (estos vendrían de tu planilla)
    const datos = {
      nombre: "José Henríquez",
      whatsapp: "https://wa.me/6545948112",
      botones: {
        b1: { nombre: "Embudo Gratis", desc: "Aquí recibirás tu embudo de prueba." },
        b2: { nombre: "Reels Publicitarios", desc: "Descarga tus reels de ejemplo aquí." },
        b3: { nombre: "Comisiones", desc: "Cada cliente activo genera mínimo USD $4/mes." },
        b4: { nombre: "Soporte", desc: "Contáctanos por WhatsApp para acompañamiento personalizado." },
        b5: { nombre: "Preguntas Frecuentes", desc: "Aquí encontrarás respuestas rápidas." }
        // Si agregas b6, b7… el script los detecta automáticamente
      }
    };

    // Personalización
    document.getElementById("nombreAfiliado").textContent = datos.nombre;
    document.getElementById("waLink").href = datos.whatsapp;

    // Render dinámico de botones
    const contenedor = document.getElementById("botones");
    Object.keys(datos.botones).forEach(key => {
      const btn = document.createElement("button");
      btn.className = "chat-btn";
      btn.textContent = datos.botones[key].nombre;
      btn.onclick = () => mostrarMensaje(datos.botones[key].desc);
      contenedor.appendChild(btn);
    });

    // Función para mostrar mensajes en el chat
    function mostrarMensaje(texto) {
      const chat = document.getElementById("chat");
      const msgUser = document.createElement("div");
      msgUser.className = "msg user";
      msgUser.textContent = "👉 " + texto;
      chat.appendChild(msgUser);
    }
  </script>
</body>
</html>
