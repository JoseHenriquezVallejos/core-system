<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia Llave en Mano - Ayuda</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background:#f1f5f9; margin:0; padding:20px; }
    h1 { color:#0f172a; }
    .accordion { background:#fff; border:1px solid #cbd5e1; border-radius:8px; margin-bottom:10px; }
    .accordion-header { padding:12px; cursor:pointer; font-weight:600; background:#f8fafc; }
    .accordion-header:hover { background:#0fb396; color:#fff; }
    .accordion-content { display:none; padding:12px; border-top:1px solid #cbd5e1; }
    .accordion.active .accordion-content { display:block; }
    .btn-small { background:#fffdf0; border:1px solid #d4af37; color:#8b6b00; font-size:0.85rem; padding:8px 10px; border-radius:6px; text-decoration:none; display:inline-block; margin-bottom:15px; }
    .btn-small:hover { background:#0fb396; color:#fff; }
  </style>
</head>
<body>
  <h1>Academia Llave en Mano 🚀</h1>
  <p>Centro de apoyo para afiliados</p>

  <a href="#" target="_blank" class="btn-small" id="whatsapp">📤 Enviar petición</a>

  <div id="acordeones"></div>

<script>
  const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSfovEU326ybyI9IoKroxh_4nvHWAYeeyv6X6rTebAKr45YY7E38eOevdi8-2r9rv712S5aTSO6QdoS/pub?gid=0&single=true&output=csv";
  const afiliadoID = "josehenriquez"; // ID en columna A

  fetch(sheetUrl)
    .then(res => res.text())
    .then(data => {
      const filas = data.split("\n").map(r => r.split(","));
      const headers = filas[0];
      const fila = filas.find(r => r[0] === afiliadoID);

      if (!fila) {
        console.error("No se encontró el afiliado:", afiliadoID);
        return;
      }

      // WhatsApp en columna C
      const whatsappLink = fila[2];
      document.getElementById("whatsapp").href = whatsappLink;

      const contenedor = document.getElementById("acordeones");

      // desde columna D (índice 3), pares: bX + Desc-bX
      for (let i = 3; i < fila.length; i += 2) {
        const nombre = fila[i];
        const descripcion = fila[i+1];
        if (nombre) {
          const acc = document.createElement("div");
          acc.className = "accordion";
          acc.innerHTML = `
            <div class="accordion-header">${nombre}</div>
            <div class="accordion-content">${descripcion || "⚠️ Sin descripción"}</div>
          `;
          contenedor.appendChild(acc);
        }
      }

      // activar acordeones
      document.querySelectorAll('.accordion-header').forEach(header => {
        header.addEventListener('click', () => {
          const accordion = header.parentElement;
          accordion.classList.toggle('active');
        });
      });
    })
    .catch(err => console.error("Error cargando planilla:", err));
</script>
</body>
</html>
