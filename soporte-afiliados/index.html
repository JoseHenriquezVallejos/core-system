<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academia Llave en Mano</title>
  <style>
    body { margin:0; font-family: 'Segoe UI', sans-serif; background:#f1f5f9; }
    .chat-container { max-width:700px; margin:auto; height:100vh; display:flex; flex-direction:column; background:#fff; }
    .header { background:#0f172a; color:#fff; padding:20px; }
    .header h1 { margin:0; font-size:1.5rem; }
    .header p { margin:0; opacity:0.7; }
    .button-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; padding:15px; }
    .btn-option { background:#f8fafc; border:1px solid #cbd5e1; padding:12px; border-radius:8px; cursor:pointer; font-weight:600; font-size:0.85rem; }
    .btn-option:hover { background:#0fb396; color:#fff; }
    .btn-small { background:#fffdf0; border:1px solid #d4af37; color:#8b6b00; font-size:0.7rem; padding:8px 10px; border-radius:6px; text-align:center; text-decoration:none; }
    .btn-small:hover { background:#0fb396; color:#fff; }
    #chat-history { flex:1; overflow-y:auto; padding:20px; }
    .msg { padding:12px; border-radius:10px; margin-bottom:10px; max-width:90%; }
    .bot-msg { background:#f8fafc; border:1px solid #e2e8f0; }
    .user-msg { background:#0fb396; color:#fff; margin-left:auto; }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="header">
    <h1>Academia Llave en Mano</h1>
    <p>Centro de apoyo para afiliados 🚀</p>
  </div>
