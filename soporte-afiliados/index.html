<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> 
    <title>ProverbsAcademy</title>
    <style>
        :root { 
            --header-bg: #0f172a; 
            --page-bg: #f1f5f9;
            --chat-bg: #ffffff;
            --btn-green: #0fb396;
            --prayer-gold: #d4af37;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--page-bg); height: 100vh; display: flex; justify-content: center; overflow: hidden; }
        .chat-container { width: 100%; max-width: 700px; display: flex; flex-direction: column; background-color: var(--chat-bg); height: 100%; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        .header-premium { background-color: var(--header-bg); color: white; padding: 20px 30px; flex-shrink: 0; }
        .header-premium h1 { margin: 0 0 5px 0; font-size: 1.5rem; }
        .header-premium p { margin: 0; opacity: 0.7; font-size: 0.85rem; }
        
        .button-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 15px; background: white; border-bottom: 2px solid #e2e8f0; }
        .btn-option { background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px 5px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.75rem; color: #334155; transition: 0.2s; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .btn-option:hover { background: var(--btn-green); color: white; border-color: var(--btn-green); }
        .btn-prayer { background: #fffdf0; border: 1px solid var(--prayer-gold); color: #8b6b00; }

        #chat-history { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 14px 18px; border-radius: 12px; max-width: 92%; line-height: 1.6; word-wrap: break-word; font-size: 15px; }
        .bot-msg { background: #f8fafc; border: 1px solid #e2e8f0; align-self: flex-start; }
        .user-msg { background: var(--btn-green); color: white; align-self: flex-end; }
        
        #chat-history::after { content: ""; display: block; height: 30px; }

        @media (max-width: 600px) { 
            .button-grid { grid-template-columns: repeat(2, 1fr); }
            .msg { max-width: 95%; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header-premium">
        <h1 id="prod-name">Cargando...</h1>
        <p id="prod-sub">Cargando...</p>
    </div>

    <div class="button-grid" id="menu-oracion"></div>

    <div id="chat-history">
        <div class="msg bot-msg">Bienvenido, selecciona una opción para comenzar.</div>
    </div>
</div>

<script src="config.js"></script>

<script>
    // Inicializar interfaz con datos de config.js
    document.getElementById('prod-name').innerText = configuracion.nombreProducto;
    document.getElementById('prod-sub').innerText = configuracion.subtitulo;

    const grid = document.getElementById('menu-oracion');
    
    // Dibujar botones desde la configuración
    configuracion.botones.forEach(opcion => {
        const btn = document.createElement('button');
        btn.className = 'btn-option btn-prayer';
        btn.innerText = opcion;
        btn.onclick = () => sendChoice(opcion);
        grid.appendChild(btn);
    });

    // Añadir botón de contacto
    const link = document.createElement('a');
    link.href = configuracion.whatsappLink;
    link.target = "_blank";
    link.className = 'btn-option btn-prayer';
    link.innerText = "📤 Enviar petición";
    grid.appendChild(link);

    // Lógica principal
    function sendChoice(choice) {
        const history = document.getElementById('chat-history');
        const respuestaFinal = configuracion.respuestas[choice] || "Selecciona una opción válida.";

        history.innerHTML += `<div class="msg user-msg">${choice}</div>`;
        history.innerHTML += `<div class="msg bot-msg">${respuestaFinal}</div>`;
        history.scrollTop = history.scrollHeight;
    }
</script>
</body>
</html>
