<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreFlow SaaS Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 right-5 z-50 transform translate-x-full transition-transform duration-300 bg-emerald-600 text-white px-5 py-2.5 rounded-xl shadow-xl text-xs font-semibold flex items-center gap-2 pointer-events-none">
        <i class="fa-solid fa-circle-check"></i> <span id="toast-msg">Sincronizado</span>
    </div>

    <!-- Header Dinámico -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-30 flex items-center justify-between shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl shadow">
                <i class="fa-solid fa-bolt text-lg"></i>
            </div>
            <div>
                <h1 id="app-title" class="font-bold text-base leading-none">CoreFlow</h1>
                <p id="tenant-name" class="text-[11px] text-slate-400 mt-1">Cargando...</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <button onclick="window.switchStep('admin')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2 rounded-xl border border-slate-700 transition" title="Configuración">
                <i class="fa-solid fa-gear text-indigo-400 text-base"></i>
            </button>

            <nav class="flex items-center space-x-1 bg-slate-950 p-1 rounded-xl border border-slate-800" id="nav-steps">
                <button onclick="window.switchStep(1)" id="btn-step1" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white">Etapa 1</button>
                <button onclick="window.switchStep(2)" id="btn-step2" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white">Etapa 2</button>
                <button onclick="window.switchStep(3)" id="btn-step3" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white">Etapa 3</button>
                <button onclick="window.switchStep(4)" id="btn-step4" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white">Etapa 4</button>
            </nav>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-1 flex flex-col overflow-hidden p-4 md:p-6 max-w-7xl mx-auto w-full">

        <!-- ETAPA 1 -->
        <section id="view-step1" class="flex-1 space-y-4">
            <h2 id="title-step1" class="text-lg font-bold border-b border-slate-800 pb-3 text-white">Unidades</h2>
            <div id="grid-step1" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
        </section>

        <!-- ETAPA 2 -->
        <section id="view-step2" class="flex-1 flex flex-col md:flex-row gap-4 hidden">
            <div class="flex-1 space-y-3">
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
                    <span class="text-xs text-slate-400 font-bold uppercase">Unidad Activa: <strong id="active-unit-id" class="text-white text-sm ml-1">---</strong></span>
                    <button onclick="window.switchStep(1)" class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-lg border border-slate-700">Cambiar</button>
                </div>
                <div id="grid-catalog" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3"></div>
            </div>
            <aside class="w-full md:w-80 bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
                <div>
                    <h3 class="text-sm font-bold border-b border-slate-800 pb-2 mb-3">Detalle del Registro</h3>
                    <input type="text" id="input-responsible" placeholder="Responsable / Atendió" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white mb-3 focus:outline-none focus:border-indigo-500">
                    <div id="cart-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
                </div>
                <div class="border-t border-slate-800 pt-3 mt-4 space-y-3">
                    <div class="flex justify-between font-bold text-sm"><span>Total:</span><span id="cart-total" class="text-indigo-400">$0</span></div>
                    <button onclick="window.saveAndAdvanceStep2()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/30">Enviar a Proceso ➔</button>
                </div>
            </aside>
        </section>

        <!-- ETAPA 3 -->
        <section id="view-step3" class="flex-1 space-y-4 hidden">
            <h2 id="title-step3" class="text-lg font-bold border-b border-slate-800 pb-3 text-amber-400">En Proceso</h2>
            <div id="grid-step3" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

        <!-- ETAPA 4 -->
        <section id="view-step4" class="flex-1 space-y-4 hidden">
            <h2 id="title-step4" class="text-lg font-bold border-b border-slate-800 pb-3 text-emerald-400">Listos para Cierre</h2>
            <div id="grid-step4" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

        <!-- PANEL DE CONFIGURACIÓN (⚙️) -->
        <section id="view-admin" class="flex-1 space-y-6 overflow-y-auto hidden">
            <h2 class="text-lg font-bold border-b border-slate-800 pb-3 text-indigo-400 flex items-center gap-2">
                <i class="fa-solid fa-sliders"></i> Configuración General
            </h2>

            <!-- Gestión de Unidades -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-sm text-white">Unidades Registradas</h3>
                    <button onclick="window.addUnitPrompt()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">+ Agregar Unidad</button>
                </div>
                <div id="admin-units-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
            </div>

            <hr class="border-slate-800">

            <!-- Gestión de Catálogo -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-sm text-white">Catálogo de Servicios / Productos</h3>
                    <button onclick="document.getElementById('form-add-item').classList.toggle('hidden')" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition">+ Agregar Ítem</button>
                </div>

                <form id="form-add-item" onsubmit="window.saveCatalogItem(event)" class="hidden bg-slate-900 border border-slate-800 p-4 rounded-xl space-y-3 max-w-md">
                    <input type="text" id="item-name" placeholder="Nombre del Servicio / Producto" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <input type="number" id="item-price" placeholder="Precio ($)" required min="0" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <div class="flex justify-end space-x-2">
                        <button type="button" onclick="document.getElementById('form-add-item').classList.add('hidden')" class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-lg text-xs font-semibold">Cancelar</button>
                        <button type="submit" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold">Guardar</button>
                    </div>
                </form>

                <div id="admin-catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
            </div>
        </section>

    </main>

    <script>
        const SUPABASE_URL = 'https://kosyaamaocsslumanzrm.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_JwZ4ND6W9nMsqsOME-bc0A_JZYisN-4';
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const tenantId = new URLSearchParams(window.location.search).get('id') || 'don-pepe';

        let appState = { units: {}, catalog: [], activeUnit: null, cart: [] };

        function toast(msg) {
            document.getElementById('toast-msg').textContent = msg;
            const t = document.getElementById('toast');
            t.classList.remove('translate-x-full');
            setTimeout(() => t.classList.add('translate-x-full'), 2500);
        }

        window.switchStep = function(step) {
            ['1', '2', '3', '4', 'admin'].forEach(s => {
                const el = document.getElementById(`view-step${s}`) || document.getElementById(`view-${s}`);
                if (el) el.classList.toggle('hidden', s !== String(step));
            });

            [1, 2, 3, 4].forEach(s => {
                const btn = document.getElementById(`btn-step${s}`);
                if (btn) {
                    btn.className = s === step ? 
                        "px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white" : 
                        "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white";
                }
            });
        };

        async function initSaaS() {
            const { data: tenant } = await client.from('tenants').select('*').eq('id', tenantId).single();
            if (!tenant) return;

            document.getElementById('tenant-name').textContent = tenant.nombre_negocio;
            const labels = tenant.config_etiquetas?.etapas || {};

            document.getElementById('btn-step1').textContent = labels.step_1 || "Etapa 1";
            document.getElementById('btn-step2').textContent = labels.step_2 || "Etapa 2";
            document.getElementById('btn-step3').textContent = labels.step_3 || "Etapa 3";
            document.getElementById('btn-step4').textContent = labels.step_4 || "Etapa 4";

            document.getElementById('title-step1').textContent = labels.step_1 || "Unidades";
            document.getElementById('title-step3').textContent = labels.step_3 || "En Proceso";
            document.getElementById('title-step4').textContent = labels.step_4 || "Cierre / Facturación";

            await fetchCatalog();
            await fetchUnits();

            client.channel('saas-realtime')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'mesas' }, () => fetchUnits())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'menu' }, () => fetchCatalog())
                .subscribe();
        }

        async function fetchCatalog() {
            const { data: menu } = await client.from('menu').select('*').eq('tenant_id', tenantId);
            appState.catalog = menu || [];
            renderCatalog();
            renderAdminCatalog();
        }

        async function fetchUnits() {
            const { data: units } = await client.from('mesas').select('*').eq('tenant_id', tenantId);
            appState.units = {};
            (units || []).forEach(u => appState.units[u.numero_mesa] = u);
            renderStep1();
            renderStep3();
            renderStep4();
            renderAdminUnits();
        }

        // --- RENDERIZADO ETAPA 1 (MARCADO EN TIEMPO REAL) ---
        function renderStep1() {
            const grid = document.getElementById('grid-step1');
            grid.innerHTML = '';
            Object.keys(appState.units).sort().forEach(id => {
                const u = appState.units[id];
                const state = u.estado || 'free';
                const total = (u.items || []).reduce((acc, i) => acc + (i.price * i.quantity), 0);
                
                let badge = `<span class="text-[10px] text-slate-400 font-bold bg-slate-800 px-2 py-0.5 rounded">DISPONIBLE</span>`;
                let border = "border-slate-800 bg-slate-900";
                let btnStyle = "bg-slate-800 hover:bg-indigo-600 text-white";
                let btnText = "Abrir Registro";

                if (state === 'occupied') {
                    badge = `<span class="text-[10px] text-amber-400 font-bold bg-amber-950/60 border border-amber-500/30 px-2 py-0.5 rounded">EN PROCESO ($${total.toLocaleString('es-CL')})</span>`;
                    border = "border-amber-500/60 bg-amber-950/10";
                    btnStyle = "bg-amber-600 hover:bg-amber-500 text-white font-bold shadow-lg shadow-amber-600/20";
                    btnText = "Ver en Proceso ➔";
                } else if (state === 'ready') {
                    badge = `<span class="text-[10px] text-emerald-400 font-bold bg-emerald-950/60 border border-emerald-500/30 px-2 py-0.5 rounded">POR COBRAR ($${total.toLocaleString('es-CL')})</span>`;
                    border = "border-emerald-500/60 bg-emerald-950/10";
                    btnStyle = "bg-emerald-600 hover:bg-emerald-500 text-white font-bold shadow-lg shadow-emerald-600/20";
                    btnText = "Cobrar / Cerrar ➔";
                }

                const card = document.createElement('div');
                card.className = `border ${border} rounded-xl p-4 flex flex-col justify-between space-y-3 transition shadow-md`;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="font-bold text-base text-white">${id}</h3>
                            <p class="text-[11px] text-slate-400 mt-0.5">Resp: ${u.garzon_actual || 'Sin asignar'}</p>
                        </div>
                        <i class="fa-solid fa-cube text-slate-600 text-lg"></i>
                    </div>
                    <div>${badge}</div>
                    <button onclick="window.selectUnit('${id}')" class="w-full ${btnStyle} text-xs py-2 rounded-lg transition">${btnText}</button>
                `;
                grid.appendChild(card);
            });
        }

        // --- ETAPA 2 ---
        window.selectUnit = function(id) {
            appState.activeUnit = id;
            document.getElementById('active-unit-id').textContent = id;
            const u = appState.units[id];
            appState.cart = u && u.items ? JSON.parse(JSON.stringify(u.items)) : [];
            document.getElementById('input-responsible').value = u?.garzon_actual || '';
            renderCart();
            window.switchStep(2);
        };

        function renderCatalog() {
            const grid = document.getElementById('grid-catalog');
            grid.innerHTML = '';
            appState.catalog.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center";
                card.innerHTML = `
                    <div>
                        <h4 class="font-bold text-xs text-white">${item.nombre}</h4>
                        <span class="text-xs text-indigo-400 font-semibold">$${Number(item.precio).toLocaleString('es-CL')}</span>
                    </div>
                    <button onclick="window.addToCart('${item.id}', '${item.nombre}', ${item.precio})" class="bg-slate-800 hover:bg-indigo-600 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold transition">+</button>
                `;
                grid.appendChild(card);
            });
        }

        window.addToCart = function(id, name, price) {
            const exist = appState.cart.find(i => i.id == id);
            if (exist) exist.quantity += 1;
            else appState.cart.push({ id, name, price, quantity: 1 });
            renderCart();
        };

        function renderCart() {
            const list = document.getElementById('cart-list');
            list.innerHTML = '';
            let total = 0;
            appState.cart.forEach((item, idx) => {
                total += item.price * item.quantity;
                const row = document.createElement('div');
                row.className = "bg-slate-950 border border-slate-800 p-2 rounded-lg flex justify-between items-center text-xs";
                row.innerHTML = `
                    <span>${item.quantity}x ${item.name}</span>
                    <div class="flex items-center gap-1">
                        <span class="font-bold text-slate-300">$${(item.price * item.quantity).toLocaleString('es-CL')}</span>
                        <button onclick="window.removeCart(${idx})" class="text-rose-400 hover:text-rose-300 ml-1">✕</button>
                    </div>
                `;
                list.appendChild(row);
            });
            document.getElementById('cart-total').textContent = `$${total.toLocaleString('es-CL')}`;
        }

        window.removeCart = function(idx) {
            appState.cart.splice(idx, 1);
            renderCart();
        };

        // --- PASO DE ESTADOS ---
        window.saveAndAdvanceStep2 = async function() {
            if (!appState.activeUnit || appState.cart.length === 0) return;
            const resp = document.getElementById('input-responsible').value.trim();

            await client.from('mesas').update({
                estado: 'occupied',
                items: appState.cart,
                garzon_actual: resp
            }).eq('numero_mesa', appState.activeUnit).eq('tenant_id', tenantId);

            toast("Avanzado a Proceso");
            await fetchUnits();
            window.switchStep(3);
        };

        window.advanceToStep4 = async function(id) {
            await client.from('mesas').update({ estado: 'ready' }).eq('numero_mesa', id).eq('tenant_id', tenantId);
            toast("Avanzado a Cierre");
            await fetchUnits();
            window.switchStep(4);
        };

        window.closeAndFreeUnit = async function(id) {
            if (!confirm(`¿Cobrar y liberar ${id}?`)) return;
            await client.from('mesas').update({
                estado: 'free',
                items: [],
                garzon_actual: ''
            }).eq('numero_mesa', id).eq('tenant_id', tenantId);

            toast("Unidad Finalizada y Liberada");
            await fetchUnits();
            window.switchStep(1);
        };

        // --- RENDERIZADO ETAPAS 3 Y 4 ---
        function renderStep3() {
            const grid = document.getElementById('grid-step3');
            grid.innerHTML = '';
            const active = Object.values(appState.units).filter(u => u.estado === 'occupied');
            if (active.length === 0) return grid.innerHTML = `<p class="col-span-full text-xs text-slate-500 py-6 text-center">Sin elementos en proceso.</p>`;

            active.forEach(u => {
                const total = (u.items || []).reduce((acc, i) => acc + (i.price * i.quantity), 0);
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-amber-500/30 rounded-xl p-4 space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between border-b border-slate-800 pb-2">
                        <span class="font-bold text-white text-sm">${u.numero_mesa}</span>
                        <span class="text-xs text-amber-400 font-bold">$${total.toLocaleString('es-CL')}</span>
                    </div>
                    <p class="text-[11px] text-slate-400">Atendió/Resp: ${u.garzon_actual || 'Sin asignar'}</p>
                    <button onclick="window.advanceToStep4('${u.numero_mesa}')" class="w-full bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold py-2 rounded-lg transition">Finalizar Proceso ➔</button>
                `;
                grid.appendChild(card);
            });
        }

        function renderStep4() {
            const grid = document.getElementById('grid-step4');
            grid.innerHTML = '';
            const ready = Object.values(appState.units).filter(u => u.estado === 'ready');
            if (ready.length === 0) return grid.innerHTML = `<p class="col-span-full text-xs text-slate-500 py-6 text-center">Sin elementos pendientes de cierre.</p>`;

            ready.forEach(u => {
                const total = (u.items || []).reduce((acc, i) => acc + (i.price * i.quantity), 0);
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-emerald-500/30 rounded-xl p-4 space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between border-b border-slate-800 pb-2">
                        <span class="font-bold text-white text-sm">${u.numero_mesa}</span>
                        <span class="text-sm text-emerald-400 font-bold">$${total.toLocaleString('es-CL')}</span>
                    </div>
                    <button onclick="window.closeAndFreeUnit('${u.numero_mesa}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-lg transition">Cobrar y Liberar</button>
                `;
                grid.appendChild(card);
            });
        }

        // --- ADMINISTRACIÓN ---
        window.addUnitPrompt = async function() {
            const name = prompt("Nombre de la nueva unidad (Ej: Mesa 5 o Vehículo 3):");
            if (!name) return;
            await client.from('mesas').insert({ tenant_id: tenantId, numero_mesa: name.trim(), estado: 'free', items: [] });
            toast("Unidad Agregada");
            await fetchUnits();
        };

        window.deleteUnit = async function(id) {
            if (!confirm(`¿Eliminar ${id}?`)) return;
            await client.from('mesas').delete().eq('numero_mesa', id).eq('tenant_id', tenantId);
            toast("Unidad Eliminada");
            await fetchUnits();
        };

        window.saveCatalogItem = async function(e) {
            e.preventDefault();
            const name = document.getElementById('item-name').value;
            const price = document.getElementById('item-price').value;
            await client.from('menu').insert({ tenant_id: tenantId, nombre: name, precio: Number(price) });
            toast("Ítem Guardado");
            document.getElementById('form-add-item').reset();
            document.getElementById('form-add-item').classList.add('hidden');
            await fetchCatalog();
        };

        window.deleteCatalogItem = async function(id) {
            if (!confirm("¿Eliminar del catálogo?")) return;
            await client.from('menu').delete().eq('id', id);
            toast("Ítem Eliminado");
            await fetchCatalog();
        };

        function renderAdminUnits() {
            const grid = document.getElementById('admin-units-grid');
            grid.innerHTML = '';
            Object.keys(appState.units).sort().forEach(id => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 p-2.5 rounded-xl flex justify-between items-center text-xs";
                card.innerHTML = `<span class="font-bold text-white">${id}</span><button onclick="window.deleteUnit('${id}')" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash"></i></button>`;
                grid.appendChild(card);
            });
        }

        function renderAdminCatalog() {
            const grid = document.getElementById('admin-catalog-grid');
            grid.innerHTML = '';
            appState.catalog.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center text-xs";
                card.innerHTML = `
                    <div>
                        <h4 class="font-bold text-white">${item.nombre}</h4>
                        <span class="text-indigo-400 font-semibold">$${Number(item.precio).toLocaleString('es-CL')}</span>
                    </div>
                    <button onclick="window.deleteCatalogItem('${item.id}')" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash"></i></button>
                `;
                grid.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', initSaaS);
    </script>
</body>
</html>
