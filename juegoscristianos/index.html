<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria Bíblica</title>
    <style>
        body { margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f1f5f9; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 450px; background: white; min-height: 100vh; display: flex; flex-direction: column; }
        .header { background: #0f172a; color: #ffffff; padding: 25px 20px; text-align: center; border-bottom: 4px solid #d4af37; }
        .header h1 { margin: 0; font-size: 22px; font-weight: 300; letter-spacing: 1px; text-transform: uppercase; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: #d4af37; letter-spacing: 1px; }
        
        .game-area { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 15px; color: #334155; font-size: 13px; font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .card { aspect-ratio: 1; background: #334155; border-radius: 8px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 24px; color: white; position: relative; transition: 0.3s; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card.flipped, .card.matched { background: white; border: 2px solid #d4af37; }
        .card img { width: 100%; height: 100%; object-fit: cover; display: none; border-radius: 6px; }
        .card.flipped img, .card.matched img { display: block; }
        .card.flipped span, .card.matched span { display: none; }
        .card.matched { opacity: 0.6; cursor: default; }

        .btn-restart { margin: 20px; background: #0fb396; color: white; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; cursor: pointer; border: none; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }
        .btn-restart:hover { background: #0d967e; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1 id="titulo-visual">Cargando...</h1>
        <p id="subtitulo-visual">Buscando configuración...</p>
    </div>
    
    <div class="game-area">
        <div class="stats">
            <span id="intentos">Intentos: 0</span>
            <span id="parejas">Parejas: 0 / 6</span>
        </div>
        <div class="grid" id="game-grid"></div>
    </div>

    <button class="btn-restart" onclick="iniciarJuego()">Reiniciar Juego</button>
</div>
