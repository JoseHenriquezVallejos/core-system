<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria Bíblica</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background: #f1f5f9; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
        }
        .game-container { 
            width: 100%; 
            max-width: 600px; 
            background: white; 
            padding: 20px; 
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }
        .header { 
            background: #0f172a; 
            color: #ffffff; 
            padding: 20px; 
            text-align: center; 
            border-bottom: 4px solid #d4af37; 
            border-radius: 8px 8px 0 0;
            margin-bottom: 20px;
        }
        .header h1 { margin: 0; font-size: 24px; font-weight: 400; letter-spacing: 1px; text-transform: uppercase; }
        .header p { margin: 5px 0 0 0; font-size: 14px; color: #d4af37; letter-spacing: 1px; }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
            color: #334155;
            font-size: 14px;
            padding: 0 5px;
        }

        /* Cuadrícula de 24 cartas (6 columnas x 4 filas o adaptada) */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 5px;
        }
        @media (max-width: 480px) {
            .grid { grid-template-columns: repeat(3, 1fr); }
        }

        .card {
            aspect-ratio: 1;
            background: #334155;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .card.flipped, .card.matched {
            background: #ffffff;
            border: 2px solid #d4af37;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .card.flipped img, .card.matched img {
            display: block;
        }

        .card.flipped span, .card.matched span {
            display: none;
        }

        .card.matched {
            opacity: 0.7;
            cursor: default;
        }

        .btn-restart {
            margin-top: 20px;
            background: #0fb396;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-restart:hover { background: #0d967e; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="header">
        <h1>Memoria Bíblica</h1>
        <p>Encuentra las 12 parejas de personajes</p>
    </div>

    <div class="stats">
        <span id="intentos">Intentos: 0</span>
        <span id="parejas">Parejas: 0 / 12</span>
    </div>

    <div class="grid" id="game-grid">
        </div>

    <button class="btn-restart" onclick="reiniciarJuego()">Reiniciar Juego</button>
</div>

<script>
    // Lista de 12 personajes bíblicos con sus imágenes (puedes cambiar los links por URLs reales de imágenes)
    const personajesBase = [
        { nombre: "Moisés", img: "https://images.unsplash.com/photo-1544717305-2782549b5136?w=150" }, // Ejemplo de imagen
        { nombre: "David", img: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150" },
        { nombre: "Abraham", img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150" },
        { nombre: "Noé", img: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=150" },
        { nombre: "Daniel", img: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=150" },
        { nombre: "José", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" },
        { nombre: "Ester", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150" },
        { nombre: "Rut", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150" },
        { nombre: "Jonás", img: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150" },
        { nombre: "Samuel", img: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=150" },
        { nombre: "Salomón", img: "https://images.unsplash.com/photo-1521119989659-a83eee488004?w=150" },
        { nombre: "Pablo", img: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?w=150" }
    ];

    let cartas = [];
    let cartaPrimero = null;
    let cartaSegundo = null;
    let bloqueado = false;
    let intentos = 0;
    let parejasEncontradas = 0;

    function iniciarJuego() {
        // Duplicamos los 12 personajes para hacer las 24 cartas
        cartas = [...personajesBase, ...personajesBase];
        // Mezclamos aleatoriamente
        cartas.sort(() => Math.random() - 0.5);

        const grid = document.getElementById('game-grid');
        grid.innerHTML = '';
        intentos = 0;
        parejasEncontradas = 0;
        actualizarStats();

        cartas.forEach((personaje, index) => {
            const card = document.createElement('div');
            card.classList.add('card');
            card.dataset.index = index;
            card.dataset.nombre = personaje.nombre;

            card.innerHTML = `
                <span>${index + 1}</span>
                <img src="${personaje.img}" alt="${personaje.nombre}">
            `;

            card.addEventListener('click', voltearCarta);
            grid.appendChild(card);
        });
    }

    function voltearCarta() {
        if (bloqueado) return;
        if (this === cartaPrimero) return;
        if (this.classList.contains('matched')) return;

        this.classList.add('flipped');

        if (!cartaPrimero) {
            cartaPrimero = this;
            return;
        }

        cartaSegundo = this;
        intentos++;
        actualizarStats();
        verificarPareja();
    }

    function verificarPareja() {
        const esIgual = cartaPrimero.dataset.nombre === cartaSegundo.dataset.nombre;

        if (esIgual) {
            cartaPrimero.classList.add('matched');
            cartaSegundo.classList.add('matched');
            parejasEncontradas++;
            actualizarStats();
            resetearTurno();

            if (parejasEncontradas === personajesBase.length) {
                setTimeout(() => {
                    alert(`¡Felicitaciones! Completaste el juego en ${intentos} intentos.`);
                }, 300);
            }
        } else {
            bloqueado = true;
            setTimeout(() => {
                cartaPrimero.classList.remove('flipped');
                cartaSegundo.classList.remove('flipped');
                resetearTurno();
            }, 1000); // Tiempo que se muestra la carta antes de cerrarse
        }
    }

    function resetearTurno() {
        cartaPrimero = null;
        cartaSegundo = null;
        bloqueado = false;
    }

    function actualizarStats() {
        document.getElementById('intentos').innerText = `Intentos: ${intentos}`;
        document.getElementById('parejas').innerText = `Parejas: ${parejasEncontradas} / 12`;
    }

    function reiniciarJuego() {
        iniciarJuego();
    }

    // Iniciar al cargar
    iniciarJuego();
</script>

</body>
</html>
