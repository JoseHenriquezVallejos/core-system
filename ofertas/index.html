<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar de Ofertas | Mercado Libre</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bg-ml { background-color: #ffe600; }
        .btn-ml { background-color: #3483fa; }
        .btn-ml:hover { background-color: #2968c8; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans flex flex-col justify-between">

    <!-- Header Principal -->
    <header class="bg-ml p-4 text-center shadow-md sticky top-0 z-50">
        <h1 class="text-xl font-bold text-gray-900 tracking-wide flex items-center justify-center gap-2">
            <span>⚡</span> RADAR DE OFERTAS DESTACADAS
        </h1>
        <p class="text-xs text-gray-800 font-medium mt-1">Selecciona la oferta que prefieras y compra directo en Mercado Libre</p>
    </header>

    <!-- Grilla de Ofertas -->
    <main class="max-w-4xl mx-auto p-4 w-full">
        <!-- Contenedor dinámico donde se inyectan las tarjetas -->
        <div id="contenedor-ofertas" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <p class="text-center text-gray-500 col-span-full py-8">Cargando las mejores ofertas del día...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-4 text-xs text-gray-400">
        <p>© Radar de Ofertas - Catalogo independiente de recomendación de productos.</p>
    </footer>

    <!-- Lógica JavaScript para leer Google Sheets en vivo -->
    <script>
        // INSERTA AQUÍ LA URL CSV DE TU GOOGLE SHEETS PUBLICADO EN LA WEB
        const URL_PLANILLA_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTqZHx6ed_TMyMzMCI88nb0dSO7jL8IxxZNyGzyJglaYeHQm78YIsTzrqyrNdvDlBpZxBdTD1guBOIA/pub?gid=0&single=true&output=csv';

        async function cargarOfertas() {
            try {
                const response = await fetch(URL_PLANILLA_CSV);
                const csvText = await response.text();
                
                // Convertir CSV a filas (asumiendo coma como separador)
                const filas = csvText.split('\n').map(r => r.split(','));
                const contenedor = document.getElementById('contenedor-ofertas');
                contenedor.innerHTML = '';

                // Omitir fila 0 si son encabezados (comenzar desde fila 1)
                // Ajustar índices según las columnas de tu planilla:
                // B: Título (índice 1), C: Precio Oferta (2), D: Precio Lista (3), 
                // E: Descuento (4), F: URL Imagen (5), G: Link Afiliado (6)
                
                let contador = 0;
                for (let i = 1; i < filas.length; i++) {
                    const col = filas[i];
                    if (!col || col.length < 7 || !col[1]) continue; // Fila vacía

                    const titulo = col[1].replace(/"/g, '').trim();
                    const precioOferta = Number(col[2].replace(/[^\d]/g, '')) || 0;
                    const precioLista = Number(col[3].replace(/[^\d]/g, '')) || 0;
                    const descuento = col[4].replace(/[^\d.]/g, '') || 0;
                    let rawImg = col[5].replace(/"/g, '').trim();
                    const linkAfiliado = col[6].replace(/"/g, '').trim();

                    // Aplicar Proxy para imágenes de Mercado Libre si proviene de mlstatic
                    const imgUrl = rawImg.includes('mlstatic.com') 
                        ? `https://images.weserv.nl/?url=${encodeURIComponent(rawImg)}` 
                        : rawImg;

                    const tarjetaHTML = `
                        <div class="bg-white rounded-2xl shadow-lg overflow-hidden border border-gray-200 flex flex-col justify-between">
                            <div class="relative bg-white flex justify-center items-center p-4">
                                <img src="${imgUrl}" alt="${titulo}" class="w-full h-48 object-contain">
                                <span class="absolute top-3 right-3 bg-red-600 text-white font-black text-xs px-2.5 py-1 rounded-full shadow">
                                    -${Math.round(descuento * (descuento < 1 ? 100 : 1))}% OFF
                                </span>
                            </div>

                            <div class="p-5 flex flex-col flex-grow justify-between border-t border-gray-100">
                                <div>
                                    <div class="flex items-center gap-2 mb-2">
                                        <span class="bg-green-100 text-green-800 text-xs font-semibold px-2 py-0.5 rounded">Envío FULL</span>
                                        <span class="bg-yellow-100 text-yellow-800 text-xs font-semibold px-2 py-0.5 rounded">★ 4.8</span>
                                    </div>
                                    <h2 class="text-sm font-bold text-gray-800 leading-snug mb-3 line-clamp-2">
                                        ${titulo}
                                    </h2>
                                </div>

                                <div>
                                    <div class="flex items-baseline gap-2 mb-4">
                                        <span class="text-2xl font-extrabold text-gray-900">$${precioOferta.toLocaleString('es-CL')}</span>
                                        ${precioLista > 0 ? `<span class="text-xs text-gray-400 line-through">$${precioLista.toLocaleString('es-CL')}</span>` : ''}
                                    </div>

                                    <a href="${linkAfiliado}" target="_blank" rel="noopener" 
                                       class="btn-ml text-white text-center w-full block py-3 rounded-xl font-bold text-sm shadow transform transition active:scale-95 flex items-center justify-center gap-2">
                                        <span>Ver Oferta</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                            <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
                                        </svg>
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.insertAdjacentHTML('beforeend', tarjetaHTML);
                    contador++;
                }

                if (contador === 0) {
                    contenedor.innerHTML = '<p class="text-center text-gray-500 col-span-full py-8">No hay ofertas disponibles en este momento.</p>';
                }
            } catch (err) {
                console.error("Error al cargar las ofertas:", err);
                document.getElementById('contenedor-ofertas').innerHTML = '<p class="text-center text-red-500 col-span-full py-8">Error al cargar el catálogo de ofertas.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', cargarOfertas);
    </script>
</body>
</html>
