<!DOCTYPE html>

<body>
  <h2>Abriendo la oferta en Mercado Libre...</h2>
  <p>Si la aplicación no se abre automáticamente en un momento, toca el botón:</p>
  
  <a id="btn-fallback" class="btn" href="#">Ver en la App de Mercado Libre</a>

  <script>
    // Tu enlace largo exacto sin el "https://"
    const urlSinHttps = "www.mercadolibre.cl/social/jh20250316143032?matt_word=jh20250316143032&matt_tool=46465124&forceInApp=true&ref=BOemwEW3eHIx3k0Y0zH3%2BYn%2BR2xI%2BNoIUQA3KKv2GjwdlslYejrd9xwQAN%2F7ZP3V1FC0Dt%2BYHAyBvPrO9jzxhneohob7y91FlpUfYFKLlAoyYylgnyLjIo4VmmKGqKpH3BSJHiVW9PCJhUfO65zAhy7HrajyY92f4Uz3Ttc70QVfxG2ZMccB3m92f%2FdpVA8ucFFeokI0%2FoRvV1GuCbXTI3QW5187ee0uOdr1jAvN%2Bt6qmNqy6EVoVmNB8j5zHIZdz3XJGw%3D%3D#origin=copy_link";

    const urlCompleta = "https://" + urlSinHttps;
    const intentAndroid = "intent://" + urlSinHttps + "#Intent;scheme=https;package=com.mercadolibre;S.browser_fallback_url=" + encodeURIComponent(urlCompleta) + ";end";

    const esAndroid = /Android/i.test(navigator.userAgent);
    const destino = esAndroid ? intentAndroid : urlCompleta;

    document.getElementById("btn-fallback").href = destino;

    // Salto directo a la app
    window.location.replace(destino);
  </script>
</body>
