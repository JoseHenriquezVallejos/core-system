<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargando producto...</title>

    <!-- Metaetiquetas Open Graph por defecto -->
    <meta property="og:title" id="og-title" content="Catálogo de Productos">
    <meta property="og:description" content="Toca aquí para ver los detalles y comprar directamente.">
    <meta property="og:image" id="og-image" content="">
    <meta property="og:url" id="og-url" content="">
    <meta property="og:type" content="website">

    <script>
        // URL de tu planilla publicada en CSV
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSDp3ZhtXPMIy3s7_sBXD_KiTTcKLqxFBh0IeglUWOC0PAzfnnhcsPmspKmW_obRcZR-pxVWWaJHgyr/pub?gid=0&single=true&output=csv";

        // Obtener el ID desde el enlace (ejemplo: ?id=crochet1)
        const urlParams = new URLSearchParams(window.location.search);
        const productoId = urlParams.get('id') || 'crochet1';

        // Función para parsear texto CSV a un array/objeto de JS
        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            const headers = lines[0].split(',').map(h => h.trim());
            
            return lines.slice(1).map(line => {
                const values = line.split(',');
                let row = {};
                headers.forEach((header, index) => {
                    row[header] = values[index] ? values[index].trim() : '';
                });
                return row;
            });
        }

        // Consultar la planilla y redirigir
        async function cargarProducto() {
            try {
                const response = await fetch(CSV_URL);
                const csvText = await response.text();
                const productos = parseCSV(csvText);

                // Buscar la fila por el ID (columna "ID")
                const producto = productos.find(p => p["ID"] === productoId);

                if (producto) {
                    // Actualizar etiquetas visuales con los datos de tu planilla
                    const linkDestino = producto["link Producto"];
                    const linkTarjeta = producto["tarjeta"];

                    document.getElementById("og-image").setAttribute("content", linkTarjeta);
                    document.getElementById("og-url").setAttribute("content", window.location.href);

                    // Redirección instantánea al enlace de Hotmart o Mercado Libre
                    if (linkDestino) {
                        window.location.replace(linkDestino);
                    }
                } else {
                    console.error("ID de producto no encontrado en la planilla.");
                }
            } catch (error) {
                console.error("Error leyendo la planilla CSV:", error);
            }
        }

        cargarProducto();
    </script>
</head>
<body>
    <p>Cargando información del producto...</p>
</body>
</html>
