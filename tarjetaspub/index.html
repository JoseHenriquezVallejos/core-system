<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargando oferta...</title>
    
    <!-- Metaetiquetas por defecto (respaldo inicial) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Aprende desde casa con nuestro curso online">
    <meta property="og:description" content="Toca aquí para ver los detalles y promociones disponibles.">
    <meta property="og:image" content="https://pub-9190f1c645a042929f0e4da380ae327a.r2.dev/50.jpg.webp">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSDp3ZhtXPMIy3s7_sBXD_KiTTcKLqxFBh0IeglUWOC0PAzfnnhcsPmspKmW_obRcZR-pxVWWaJHgyr/pub?gid=0&single=true&output=csv";

        async function init() {
            // 1. Obtener el ID desde la URL (ej: ?id=crochet1)
            const params = new URLSearchParams(window.location.search);
            const productId = params.get('id');

            const mensajeEl = document.getElementById("mensaje");

            if (!productId) {
                mensajeEl.innerText = "Por favor, especifica un identificador de producto válido en el enlace.";
                return;
            }

            try {
                // 2. Descargar la planilla CSV en tiempo real
                const response = await fetch(CSV_URL);
                const data = await response.text();
                const lineas = data.split('\n').filter(l => l.trim() !== '');

                let linkHotmart = "";
                let imgUrl = "";
                let descripcion = "";

                // 3. Buscar la fila correspondiente al ID 
                // Estructura: Columna A = ID, B = link Producto, C = imagen tarjeta, D = descripcion
                for (let i = 1; i < lineas.length; i++) {
                    const cols = lineas[i].split(',');
                    if (cols.length >= 4 && cols[0].trim() === productId) {
                        linkHotmart = cols[1].trim();
                        imgUrl = cols[2].trim();
                        descripcion = cols[3].trim();
                        break;
                    }
                }

                if (linkHotmart) {
                    // 4. Tomar la descripción de la planilla para el título principal de la tarjeta y pestaña
                    document.title = descripcion;
                    
                    let ogTitle = document.querySelector('meta[property="og:title"]');
                    let ogDesc = document.querySelector('meta[property="og:description"]');
                    let ogImage = document.querySelector('meta[property="og:image"]');

                    // Asignamos la descripción exacta de la planilla al og:title de la tarjeta
                    if (ogTitle) ogTitle.setAttribute('content', descripcion);
                    if (ogDesc) ogDesc.setAttribute('content', "Toca aquí para ver los detalles y promociones disponibles.");
                    if (ogImage && imgUrl) ogImage.setAttribute('content', imgUrl);

                    mensajeEl.innerText = "¡Redirigiendo a la oferta oficial...";

                    // 5. Redirigir a Hotmart tras un breve margen
                    setTimeout(() => {
                        window.location.replace(linkHotmart);
                    }, 1200);
                } else {
                    mensajeEl.innerText = "No se encontró ningún producto asociado a ese ID en la planilla.";
                }

            } catch (error) {
                console.error("Error al conectar con la planilla:", error);
                mensajeEl.innerText = "Hubo un error al procesar la información de la planilla.";
            }
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</head>
<body style="background-color: #f9f9f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="text-align: center; font-family: sans-serif;">
        <h2 style="color: #333; font-weight: 500;">Cargando contenido...</h2>
        <p id="mensaje" style="color: #666; font-size: 14px;">Preparando los detalles de tu curso</p>
    </div>
</body>
</html>
