<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte 24-7</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        /* Botón Flotante */
        .chat-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            z-index: 1000;
        }

        .chat-toggle-btn:hover {
            transform: scale(1.05);
        }

        /* Ventana Pop-up del Chat (Modal) */
        .chat-popup {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 350px;
            height: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .chat-popup.active {
            display: flex;
        }

        /* Cabecera del Chat */
        .chat-header {
            background-color: #075e54;
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header span {
            font-size: 12px;
            opacity: 0.8;
            font-weight: normal;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        /* Cuerpo del Historial de Mensajes */
        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #e5ddd5;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.bot {
            background-color: white;
            align-self: flex-start;
            border-top-left-radius: 0;
            color: #333;
        }

        /* Contenedor de Opciones / Botones Interactivos (Hasta 6 Reglas) */
        .chat-footer {
            padding: 10px;
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 180px;
            overflow-y: auto;
        }

        .option-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background-color: white;
            border: 1px solid #ddd;
            padding: 10px 12px;
            border-radius: 6px;
            text-decoration: none;
            color: #333;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.2s;
        }

        .option-btn:hover {
            background-color: #f1f1f1;
            border-color: #ccc;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Botón flotante para abrir el chat -->
    <button class="chat-toggle-btn" onclick="toggleChat()">💬 Soporte 24-7</button>

    <!-- Ventana flotante (Pop-up) -->
    <div class="chat-popup" id="chatPopup">
        <div class="chat-header">
            <div>
                <div id="business-name">Soporte 24-7</div>
                <span>🟢 En línea</span>
            </div>
            <button class="close-btn" onclick="toggleChat()">✕</button>
        </div>

        <div class="chat-body" id="chatBody">
            <!-- Mensaje de bienvenida inyectado por script -->
            <div class="message bot" id="welcome-message"></div>
        </div>

        <!-- Contenedor de las hasta 6 reglas dinámicas -->
        <div class="chat-footer" id="rules-container">
            <a href="#" class="option-btn hidden" id="rule-btn-1"><span class="emoji">🎁</span><span class="text"></span></a>
            <a href="#" class="option-btn hidden" id="rule-btn-2"><span class="emoji">🎬</span><span class="text"></span></a>
            <a href="#" class="option-btn hidden" id="rule-btn-3"><span class="emoji">💰</span><span class="text"></span></a>
            <a href="#" class="option-btn hidden" id="rule-btn-4"><span class="emoji">💬</span><span class="text"></span></a>
            <a href="#" class="option-btn hidden" id="rule-btn-5"><span class="emoji">⭐</span><span class="text"></span></a>
            <a href="#" class="option-btn hidden" id="rule-btn-6"><span class="emoji">📅</span><span class="text"></span></a>
        </div>
    </div>

    <script>
        // DATOS DEL CLIENTE (Simulados: esto vendrá posteriormente directo de tu Google Sheet)
        const clienteData = {
            nombreNegocio: "Academia Afiliados Pro",
            bienvenida: "¡Hola! Bienvenido al centro de apoyo automatizado. Selecciona una opción rápida para avanzar:",
            reglas: [
                { texto: "Paso 1 – Embudo Gratis", link: "https://wa.me/tuenlace1" },
                { texto: "Ver Reels Publicitarios", link: "https://wa.me/tuenlace2" },
                { texto: "Información de Comisiones", link: "https://wa.me/tuenlace3" },
                { texto: "Hablar con un asesor (WhatsApp)", link: "https://wa.me/tuenlace4" },
                { texto: "", link: "" }, // Regla 5 vacía -> Se oculta automáticamente
                { texto: "", link: "" }  // Regla 6 vacía -> Se oculta automáticamente
            ]
        };

        const chatPopup = document.getElementById("chatPopup");
        let isOpen = false;

        function toggleChat() {
            isOpen = !isOpen;
            if (isOpen) {
                chatPopup.classList.add("active");
            } else {
                chatPopup.classList.remove("active");
            }
        }

        // Inicializar datos visuales del cliente al cargar la página
        document.getElementById('business-name').innerText = clienteData.nombreNegocio;
        document.getElementById('welcome-message').innerText = clienteData.bienvenida;

        // Recorrer las 6 reglas predefinidas y activar solo las que tengan contenido
        clienteData.reglas.forEach((regla, index) => {
            const btnId = `rule-btn-${index + 1}`;
            const btnElement = document.getElementById(btnId);
            
            if (regla.texto && regla.texto.trim() !== "") {
                btnElement.querySelector('.text').innerText = regla.texto;
                btnElement.href = regla.link;
                btnElement.target = "_blank"; // Abre el enlace de destino de forma limpia
                btnElement.classList.remove('hidden'); // Muestra el botón
            }
        });
    </script>
</body>
</html>
