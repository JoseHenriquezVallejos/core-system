<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte 24-7</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        /* Botón Flotante */
        .chat-toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #25D366;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
            z-index: 1000;
        }

        .chat-toggle-btn:hover {
            transform: scale(1.05);
        }

        /* Ventana Pop-up del Chat (Modal) */
        .chat-popup {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 350px;
            height: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        .chat-popup.active {
            display: flex;
        }

        /* Cabecera del Chat */
        .chat-header {
            background-color: #075e54;
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header span {
            font-size: 12px;
            opacity: 0.8;
            font-weight: normal;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        /* Contenedor de Opciones / Botones Interactivos (Ubicados ARRIBA) */
        .chat-options-container {
            padding: 10px;
            background: #f0f0f0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 160px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
        }

        .option-btn {
            background-color: white;
            border: 1px solid #ddd;
            padding: 10px 12px;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: #333;
            transition: background 0.2s;
        }

        .option-btn:hover {
            background-color: #f1f1f1;
            border-color: #ccc;
        }

        /* Cuerpo del Historial de Mensajes (Ubicado ABAJO de los botones) */
        .chat-body {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #e5ddd5;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.bot {
            background-color: white;
            align-self: flex-start;
            border-top-left-radius: 0;
            color: #333;
        }

        .message.user {
            background-color: #dcf8c6;
            align-self: flex-end;
            border-top-right-radius: 0;
            color: #333;
        }
    </style>
</head>
<body>

    <!-- Botón flotante para abrir el chat -->
    <button class="chat-toggle-btn" onclick="toggleChat()">💬 Soporte 24-7</button>

    <!-- Ventana flotante (Pop-up) -->
    <div class="chat-popup" id="chatPopup">
        <div class="chat-header">
            <div>
                <div id="business-name">Soporte 24-7</div>
                <span>🟢 En línea</span>
            </div>
            <button class="close-btn" onclick="toggleChat()">✕</button>
        </div>

        <!-- Los botones interactivos están ahora ARRIBA para acceso inmediato -->
        <div class="chat-options-container" id="chatOptions">
        </div>

        <!-- El historial de mensajes queda ABAJO acumulándose -->
        <div class="chat-body" id="chatBody">
        </div>
    </div>

    <script>
        const chatFlow = {
            inicio: {
                texto: "¡Hola! Bienvenido al centro de apoyo automatizado. Selecciona una opción para avanzar:",
                opciones: [
                    { texto: "🎁 Paso 1 – Embudo Gratis", siguiente: "regla1" },
                    { texto: "🎬 Ver Videos y Demostración", siguiente: "regla2" },
                    { texto: "💰 Información de Precios", siguiente: "regla3" },
                    { texto: "💬 Hablar con un Asesor (WhatsApp)", siguiente: "whatsapp" },
                    { texto: "⭐ Ver Testimonios", siguiente: "regla5" },
                    { texto: "📅 Agendar Llamada", siguiente: "regla6" }
                ]
            },
            regla1: {
                texto: "El Paso 1 consiste en configurar tu estructura base para empezar a filtrar prospectos sin complicaciones.",
                opciones: [
                    { texto: "📥 Abrir enlace del recurso", link: "https://wa.me/tuenlace1" },
                    { texto: "⬅️ Volver al menú principal", siguiente: "inicio" }
                ]
            },
            regla2: {
                texto: "Los videos están diseñados para mostrar paso a paso cómo funciona el sistema.",
                opciones: [
                    { texto: "📺 Ver video demostrativo ahora", link: "https://wa.me/tuenlace2" },
                    { texto: "⬅️ Volver al menú principal", siguiente: "inicio" }
                ]
            },
            regla3: {
                texto: "Puedes acceder a todo el sistema operativo por solo $24 USD al año.",
                opciones: [
                    { texto: "🚀 ¡Quiero activar mi cuenta!", link: "https://wa.me/tuenlace3" },
                    { texto: "⬅️ Volver al menú principal", siguiente: "inicio" }
                ]
            },
            regla5: {
                texto: "Aquí puedes ver las experiencias de otros usuarios que ya automatizaron su atención.",
                opciones: [
                    { texto: "⭐ Leer opiniones de clientes", link: "https://wa.me/tuenlace5" },
                    { texto: "⬅️ Volver al menú principal", siguiente: "inicio" }
                ]
            },
            regla6: {
                texto: "Selecciona un horario disponible para que conversemos directamente.",
                opciones: [
                    { texto: "📅 Abrir calendario de citas", link: "https://wa.me/tuenlace6" },
                    { texto: "⬅️ Volver al menú principal", siguiente: "inicio" }
                ]
            },
            whatsapp: {
                texto: "Te estamos derivando de inmediato con nuestro canal de atención directa en WhatsApp.",
                opciones: [
                    { texto: "🟢 Abrir chat en WhatsApp", link: "https://wa.me/TUNUMERO?text=Hola,%20vengo%20desde%20el%20asistente%20web%20y%20quiero%20más%20información." },
                    { texto: "⬅️ Volver al menú principal", siguiente: "inicio" }
                ]
            }
        };

        const chatPopup = document.getElementById("chatPopup");
        const chatBody = document.getElementById("chatBody");
        const chatOptions = document.getElementById("chatOptions");

        let isOpen = false;

        function toggleChat() {
            isOpen = !isOpen;
            if (isOpen) {
                chatPopup.classList.add("active");
                if (chatBody.children.length === 0) {
                    cargarPaso("inicio");
                }
            } else {
                chatPopup.classList.remove("active");
            }
        }

        function cargarPaso(pasoKey) {
            const paso = chatFlow[pasoKey];

            // 1. Mostrar mensaje del bot en el historial (abajo)
            const mensajeBot = document.createElement("div");
            mensajeBot.className = "message bot";
            mensajeBot.innerText = paso.texto;
            chatBody.appendChild(mensajeBot);
            chatBody.scrollTop = chatBody.scrollHeight;

            // 2. Actualizar botones interactivos (fijos arriba)
            chatOptions.innerHTML = "";
            paso.opciones.forEach(op => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = op.texto;
                
                btn.onclick = () => {
                    // Registrar la respuesta del usuario en el historial
                    const mensajeUser = document.createElement("div");
                    mensajeUser.className = "message user";
                    mensajeUser.innerText = op.texto;
                    chatBody.appendChild(mensajeUser);
                    chatBody.scrollTop = chatBody.scrollHeight;

                    chatOptions.innerHTML = "";

                    setTimeout(() => {
                        if (op.link) {
                            window.open(op.link, "_blank");
                            cargarPaso("inicio");
                        } else if (op.siguiente) {
                            cargarPaso(op.siguiente);
                        }
                    }, 400);
                };
                
                chatOptions.appendChild(btn);
            });
        }
    </script>
</body>
</html>
