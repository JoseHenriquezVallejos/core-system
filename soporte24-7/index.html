<script>
        let chatFlow = {
            inicio: {
                texto: "¡Hola! Bienvenido al centro de apoyo automatizado. Selecciona una opción para avanzar:",
                opciones: []
            }
        };

        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQY4PiDZRnZMXs9N8sZNyLzlr3kFZ3vQ-qaWHmTdvRO7U5eTyfOLcEMQLwMtrwELgfy3OWCj4z9GeJM/pub?gid=0&single=true&output=csv";
        
        const urlParams = new URLSearchParams(window.location.search);
        let TARGET_ID = urlParams.get('id');

        if (!TARGET_ID) {
            const pathSegments = window.location.pathname.split("/").filter(Boolean);
            if (pathSegments.length > 0) {
                let lastSegment = pathSegments[pathSegments.length - 1];
                if (!lastSegment.includes(".html") && !lastSegment.includes(".php")) {
                    TARGET_ID = lastSegment;
                }
            }
        }

        if (!TARGET_ID) {
            TARGET_ID = 'negocio1';
        }

        function parseCSVLine(text) {
            let result = [], cell = '', inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === ',' && !inQuotes) {
                    result.push(cell.trim());
                    cell = '';
                } else {
                    cell += c;
                }
            }
            result.push(cell.trim());
            return result;
        }

        async function cargarDatosPlanilla() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                const rows = data.split("\n").map(row => parseCSVLine(row));
                
                if (rows.length < 2) return;

                let negocioRow = null;
                for (let i = 1; i < rows.length; i++) {
                    if (rows[i][0] && rows[i][0].trim().toLowerCase() === TARGET_ID.trim().toLowerCase()) {
                        negocioRow = rows[i];
                        break;
                    }
                }

                if (!negocioRow) {
                    document.getElementById("business-name").innerText = "No disponible";
                    document.getElementById("business-subtitle").innerText = "🔴 Error";
                    
                    const mensajeBot = document.createElement("div");
                    mensajeBot.className = "message bot";
                    mensajeBot.innerText = "El negocio o código especificado no existe.";
                    chatBody.appendChild(mensajeBot);
                    chatBody.scrollTop = chatBody.scrollHeight;
                    return;
                }

                const nombreVisual = negocioRow[1];
                const iconoUrl = negocioRow[20]; // Columna U

                if (nombreVisual) {
                    document.getElementById("business-name").innerText = nombreVisual;
                    document.getElementById("business-subtitle").innerText = "🟢 Soporte 24-7";
                }

                if (iconoUrl) {
                    const avatarImg = document.getElementById("business-avatar");
                    avatarImg.src = iconoUrl;
                    avatarImg.style.display = "block";

                    const manifestData = {
                        name: nombreVisual,
                        short_name: nombreVisual,
                        start_url: window.location.href,
                        display: "standalone",
                        background_color: "#075e54",
                        theme_color: "#075e54",
                        icons: [
                            { src: iconoUrl, sizes: "192x192", type: "image/jpeg" },
                            { src: iconoUrl, sizes: "512x512", type: "image/jpeg" }
                        ]
                    };

                    const blob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
                    document.getElementById("dynamic-manifest").href = URL.createObjectURL(blob);

                    let linkIcon = document.querySelector("link[rel*='icon']") || document.createElement('link');
                    linkIcon.type = 'image/jpeg';
                    linkIcon.rel = 'shortcut icon';
                    linkIcon.href = iconoUrl;
                    document.getElementsByTagName('head')[0].appendChild(linkIcon);
                }

                let opcionesInicio = [];

                for (let b = 1; b <= 6; b++) {
                    let idxBoton = 2 + (b - 1) * 3;
                    let idxDesc = idxBoton + 1;
                    let idxLink = idxBoton + 2;

                    let textoBoton = negocioRow[idxBoton] ? negocioRow[idxBoton].trim() : "";
                    let descBoton = negocioRow[idxDesc] ? negocioRow[idxDesc].trim() : "";
                    let linkBoton = negocioRow[idxLink] ? negocioRow[idxLink].trim() : "";

                    if (textoBoton) {
                        let itemConfig = {
                            texto: textoBoton
                        };

                        if (linkBoton && (linkBoton.startsWith("http://") || linkBoton.startsWith("https://"))) {
                            itemConfig.link = linkBoton;
                        } else {
                            let pasoKey = "btn_" + b;
                            chatFlow[pasoKey] = {
                                texto: descBoton || "Información disponible en este apartado.",
                                opciones: [
                                    {
                                        texto: "⬅️ Volver al menú principal",
                                        accion: "menu"
                                    }
                                ]
                            };
                            itemConfig.siguiente = pasoKey;
                        }

                        opcionesInicio.push(itemConfig);
                    }
                }

                chatFlow.inicio.opciones = opcionesInicio;
                cargarPaso("inicio", true);

            } catch (error) {
                console.error("Error al cargar la planilla:", error);
                document.getElementById("business-name").innerText = "Error de conexión";
                document.getElementById("business-subtitle").innerText = "🔴 Offline";
                
                const mensajeBot = document.createElement("div");
                mensajeBot.className = "message bot";
                mensajeBot.innerText = "No se pudo cargar la información en este momento.";
                chatBody.appendChild(mensajeBot);
                chatBody.scrollTop = chatBody.scrollHeight;
            }
        }

        const chatBody = document.getElementById("chatBody");
        const chatOptions = document.getElementById("chatOptions");
        const btnInstall = document.getElementById("btnInstall");
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            btnInstall.style.display = "block";
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                btnInstall.style.display = 'none';
            }
        });

        window.onload = () => {
            cargarDatosPlanilla();
        };

        function cargarPaso(pasoKey, mostrarTexto = true) {
            const paso = chatFlow[pasoKey];
            if (!paso) return;

            if (mostrarTexto) {
                const mensajeBot = document.createElement("div");
                
                if (paso.texto.includes("\n") || paso.texto.length > 70) {
                    mensajeBot.className = "message card";
                    mensajeBot.innerText = paso.texto.replace(/•/g, '\n•');
                } else {
                    mensajeBot.className = "message bot";
                    mensajeBot.innerText = paso.texto;
                }

                chatBody.appendChild(mensajeBot);
                chatBody.scrollTop = chatBody.scrollHeight;
            }

            renderizarOpciones(paso.opciones);
        }

        function renderizarOpciones(opciones) {
            chatOptions.innerHTML = "";
            
            if (deferredPrompt) {
                chatOptions.appendChild(btnInstall);
            }

            opciones.forEach(op => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = op.texto;
                
                btn.onclick = () => {
                    if (op.link) {
                        window.open(op.link, "_blank");
                        return;
                    }

                    const mensajeUser = document.createElement("div");
                    mensajeUser.className = "message user";
                    mensajeUser.innerText = op.texto;
                    chatBody.appendChild(mensajeUser);
                    chatBody.scrollTop = chatBody.scrollHeight;

                    chatOptions.innerHTML = "";

                    setTimeout(() => {
                        if (op.accion === "menu") {
                            cargarPaso("inicio", false);
                        } else if (op.siguiente) {
                            cargarPaso(op.siguiente, true);
                        }
                    }, 200);
                };
                
                chatOptions.appendChild(btn);
            });
        }
    </script>
