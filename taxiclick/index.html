<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaxiClick</title>
    <!-- Manifest dinámico -->
    <link id="dynamic-manifest" rel="manifest" href="./manifest.json">
    <!-- Icono dinámico -->
    <link id="dynamic-favicon" rel="icon" href="./icono.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <style>
        body { margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #f1f5f9; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 700px; background: white; padding-bottom: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); min-height: 100vh; position: relative; box-sizing: border-box; }
        .header { background: #0f172a; color: #ffffff; padding: 25px 20px; text-align: center; border-bottom: 4px solid #d4af37; }
        .header h1 { margin: 0; font-size: 26px; font-weight: 300; letter-spacing: 1px; }
        .header p { margin: 5px 0 0 0; font-size: 13px; color: #d4af37; letter-spacing: 2px; }
        
        #contenido-principal { display: none; }

        .swiper { width: 100%; height: auto !important; background: #ffffff; padding: 10px 10px 15px 10px; box-sizing: border-box; }
        .swiper-slide { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 280px; }
        .swiper-slide img { width: 100%; max-height: 220px; object-fit: contain; display: block; }
        
        .slide-desc { 
            font-size: 14px; 
            color: #d4af37; 
            margin-top: 10px; 
            font-weight: 600; 
            text-align: center; 
            padding: 0 15px;
            line-height: 1.3; 
            min-height: 2.8em; 
        }

        /* BOTONES PRINCIPALES ARRIBA */
        .button-grid { display: flex; flex-direction: column; gap: 8px; padding: 10px 15px; }
        .btn-action { background: #334155; color: white; padding: 12px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; width: 100%; box-sizing: border-box; }
        .btn-green { background: #0fb396; }

        /* GRILLA DE TAXISTAS */
        .drivers-section { padding: 10px 15px; margin-top: 10px; }
        .drivers-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .drivers-title { font-size: 15px; font-weight: bold; color: #0f172a; margin: 0; }
        .drivers-badge { font-size: 11px; background: #e2e8f0; color: #475569; padding: 3px 8px; border-radius: 12px; font-weight: 600; }
        .driver-card { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; border: 1px solid #e2e8f0; border-left: 4px solid #0fb396; padding: 10px 12px; border-radius: 8px; margin-bottom: 8px; }
        .driver-info { display: flex; align-items: center; gap: 10px; }
        .driver-badge { background: #d4af37; color: #0f172a; font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 4px; }
        .driver-name { font-size: 14px; font-weight: bold; color: #1e293b; }
        .btn-call { background: #0fb396; color: white; text-decoration: none; padding: 8px 14px; border-radius: 6px; font-size: 13px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1 id="nombre-visual">Cargando...</h1>
        <p id="subtitulo-visual">Obteniendo información...</p>
    </div>
    
    <div id="contenido-principal">
        <div class="swiper main-swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide" id="slide-1"><img id="f1" src=""><p id="desc1" class="slide-desc"></p></div>
                <div class="swiper-slide" id="slide-2"><img id="f2" src=""><p id="desc2" class="slide-desc"></p></div>
                <div class="swiper-slide" id="slide-3"><img id="f3" src=""><p id="desc3" class="slide-desc"></p></div>
                <div class="swiper-slide" id="slide-4"><img id="f4" src=""><p id="desc4" class="slide-desc"></p></div>
                <div class="swiper-slide" id="slide-5"><img id="f5" src=""><p id="desc5" class="slide-desc"></p></div>
            </div>
            <div class="swiper-pagination"></div>
        </div>

        <!-- Botón Principal WhatsApp -->
        <div class="button-grid">
            <a id="btn-wa" href="#" class="btn-action btn-green">💬 Contactar Central WhatsApp</a>
        </div>

        <!-- Grilla de Móviles -->
        <div class="drivers-section">
            <div class="drivers-header">
                <h3 class="drivers-title">🚖 Selecciona un móvil para llamar:</h3>
                <span id="active-drivers-count" class="drivers-badge">0 Móviles Activos</span>
            </div>
            <div id="drivers-container"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vS6_2XQtbS122bsX-_ZKI94Ef3oNDG9I1MtxXTDbTBBoQ9JDmZ7g_HRacm90_qow7wzN8QHbA68k4Bs/pub?gid=0&single=true&output=csv';
    
    async function init() {
        const params = new URLSearchParams(window.location.search);
        const idBusqueda = params.get('id');
        
        if (!idBusqueda) {
            document.getElementById('nombre-visual').innerText = "ENLACE INCOMPLETO";
            document.getElementById('subtitulo-visual').innerText = "FALTA EL ID EN LA URL";
            return;
        }

        const idLimpioBusqueda = idBusqueda.replace(/[^a-zA-Z0-9]/g, '').trim().toLowerCase();

        try {
            const res = await fetch(SHEET_URL);
            const data = await res.text();
            
            const rows = [];
            let currentRow = [];
            let currentCell = '';
            let inQuotes = false;

            for (let i = 0; i < data.length; i++) {
                let char = data[i];
                let nextChar = data[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentCell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentCell.trim());
                    currentCell = '';
                } else if ((char === '\r' || char === '\n') && !inQuotes) {
                    if (char === '\r' && nextChar === '\n') { i++; }
                    currentRow.push(currentCell.trim());
                    rows.push(currentRow);
                    currentRow = [];
                    currentCell = '';
                } else {
                    currentCell += char;
                }
            }
            if (currentCell !== '' || currentRow.length > 0) {
                currentRow.push(currentCell.trim());
                rows.push(currentRow);
            }

            // RECORRER LA PLANILLA FILA POR FILA BUSCANDO EL ID
            let user = null;
            for (let r of rows) {
                if (r && r[0]) {
                    let idFila = r[0].replace(/[^a-zA-Z0-9]/g, '').trim().toLowerCase();
                    if (idFila === idLimpioBusqueda) {
                        user = r;
                        break;
                    }
                }
            }
            
            if (user) {
                // Columna B (índice 1) -> Título
                let nombreAfiliado = user[1] ? user[1].replace(/['"]+/g, '').trim() : "TaxiClick";
                // Columna C (índice 2) -> Subtítulo
                let subtituloAfiliado = user[2] ? user[2].replace(/['"]+/g, '').trim() : "Línea de Taxis";

                document.getElementById('nombre-visual').innerText = nombreAfiliado;
                document.getElementById('subtitulo-visual').innerText = subtituloAfiliado;
                document.title = nombreAfiliado + " - TaxiClick";

                // Columna O (índice 14) -> Ícono
                let iconoUrl = (user[14] && user[14].trim() !== "") ? user[14].replace(/['"]+/g, '').trim() : "./icono.jpg";

                let faviconTag = document.getElementById('dynamic-favicon');
                if (faviconTag) faviconTag.href = iconoUrl;

                const manifestData = {
                    "name": nombreAfiliado,
                    "short_name": nombreAfiliado,
                    "start_url": window.location.href,
                    "display": "standalone",
                    "background_color": "#0f172a",
                    "theme_color": "#0f172a",
                    "icons": [
                        { "src": iconoUrl, "sizes": "192x192", "type": "image/jpeg" },
                        { "src": iconoUrl, "sizes": "512x512", "type": "image/jpeg" }
                    ]
                };

                const stringManifest = JSON.stringify(manifestData);
                const blob = new Blob([stringManifest], {type: 'application/json'});
                const manifestURL = URL.createObjectURL(blob);
                document.getElementById('dynamic-manifest').setAttribute('href', manifestURL);

                // Columna D (índice 3) -> WhatsApp
                if (user[3] && user[3].trim() !== "") {
                    let urlBot = user[3].replace(/['"]+/g, '').trim();
                    document.getElementById('btn-wa').href = urlBot;
                }

                // Columnas E a N (índices 4 a 13) -> Carrusel
                for (let i = 0; i < 5; i++) {
                    let fotoCol = 4 + (i * 2);
                    let descCol = 5 + (i * 2);
                    
                    let imgUrl = user[fotoCol] ? user[fotoCol].replace(/['"]+/g, '').trim() : "";
                    let descText = user[descCol] ? user[descCol].replace(/['"]+/g, '').trim() : "";

                    let slideElement = document.getElementById('slide-' + (i + 1));

                    if (slideElement && imgUrl !== "") {
                        slideElement.style.display = 'flex';
                        if (document.getElementById('f' + (i + 1))) document.getElementById('f' + (i + 1)).src = imgUrl;
                        if (document.getElementById('desc' + (i + 1))) document.getElementById('desc' + (i + 1)).innerText = descText;
                    }
                }

                // Columna P en adelante (índice 15+) -> Grilla de Móviles
                const driversContainer = document.getElementById('drivers-container');
                driversContainer.innerHTML = '';
                let count = 0;

                for (let col = 15; col < user.length; col += 2) {
                    let desc = user[col] ? user[col].replace(/['"]+/g, '').trim() : "";
                    let link = user[col + 1] ? user[col + 1].replace(/['"]+/g, '').trim() : "";

                    if (desc !== "" && link !== "") {
                        count++;
                        let formattedCount = count < 10 ? '0' + count : count;
                        let telLink = link.startsWith('tel:') ? link : 'tel:' + link;

                        let card = document.createElement('div');
                        card.className = 'driver-card';
                        card.innerHTML = `
                            <div class="driver-info">
                                <span class="driver-badge">Móvil ${formattedCount}</span>
                                <span class="driver-name">${desc}</span>
                            </div>
                            <a href="${telLink}" class="btn-call">📞 Llamar</a>
                        `;
                        driversContainer.appendChild(card);
                    }
                }

                document.getElementById('active-drivers-count').innerText = `${count} Móviles Activos`;
                document.getElementById('contenido-principal').style.display = 'block';

                new Swiper('.main-swiper', { loop: true, autoplay: { delay: 3500 }, pagination: { el: '.swiper-pagination' } });

            } else {
                document.getElementById('nombre-visual').innerText = "ID NO ENCONTRADO";
                document.getElementById('subtitulo-visual').innerText = "VERIFICA TU ENLACE";
            }
        } catch (e) {
            console.error("Error al cargar configuración:", e);
            document.getElementById('nombre-visual').innerText = "ERROR DE CONEXIÓN";
            document.getElementById('subtitulo-visual').innerText = "INTENTA NUEVAMENTE";
        }
    }
    init();
</script>
</body>
</html>
